
services:
  db:
    image: postgres:17-alpine
    container_name: stockline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockline}
      POSTGRES_USER: ${POSTGRES_USER:-stockline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockline}
    ports:
      - "5432:5432"
    volumes:
      - stockline_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: stockline-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  stockline_postgres_data:
